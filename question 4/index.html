
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <style>
        #studentTable,
        #searchResult,
        #updateSection {
            display: none;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: left;
        }
    </style>
</head>
<body>

    <h1>Student Management System</h1>

    <!-- 1. Add Student -->
    <h2>Add New Student</h2>

    <form id="studentForm">

        <label>Student ID:</label>
        <input type="text" id="studentId" placeholder="Enter student ID" required>
        <br><br>

        <label>Full Name:</label>
        <input type="text" id="fullName" placeholder="Enter full name" required>
        <br><br>

        <label>Email Address:</label>
        <input type="email" id="email" placeholder="Enter email address" required>
        <br><br>

        <label>Age:</label>
        <input type="number" id="age" placeholder="Enter age" min="1" required>
        <br><br>

        <label>Course:</label>
        <input type="text" id="course" placeholder="Enter course" required>
        <br><br>

        <button type="submit">Add Student</button> <input type="text" id="searchId" placeholder="Enter student ID">

        <button type="button" id="searchBtn">Search Student</button>

    </form>

    

    <p id="searchMessage"></p>

    <div id="searchResult">
        <h3>Student Details</h3>
        <p>Student ID: <span id="resultId"></span></p>
        <p>Full Name: <span id="resultName"></span></p>
        <p>Email: <span id="resultEmail"></span></p>
        <p>Age: <span id="resultAge"></span></p>
        <p>Course: <span id="resultCourse"></span></p>
    </div>

   
     <hr>
    <!-- 2. Display All Students -->
    <h2>All Registered Students</h2>

    <button type="button" id="displayBtn">Display All Students</button>

    <br><br>

    <table id="studentTable">

        <thead>
            <tr>
                <th>ID</th>
                <th>Full Name</th>
                <th>Email</th>
                <th>Age</th>
                <th>Course</th>
            </tr>
        </thead>

        <tbody id="studentList"></tbody>

    </table>

    <hr>

    <script src="script.js"></script>

</body>
</html>
