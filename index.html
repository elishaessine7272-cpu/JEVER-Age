
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grading System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Student Grading System</h1>

    <form id="gradingForm">

        <label for="studentName">Student Name:</label>
        <input type="text" id="studentName" placeholder="Enter student name" required>

        <h3>Enter Subject Scores</h3>

        <label for="subject1">Mathematics:</label>
        <input type="number" id="subject1" min="0" max="100" required>
        <br><br>

        <label for="subject2">English:</label>
        <input type="number" id="subject2" min="0" max="100" required>
        <br><br>

        <label for="subject3">Biology:</label>
        <input type="number" id="subject3" min="0" max="100" required>
        <br><br>

        <label for="subject4">Chemistry:</label>
        <input type="number" id="subject4" min="0" max="100" required>
        <br><br>

        <label for="subject5">Physics:</label>
        <input type="number" id="subject5" min="0" max="100" required>
        <br><br>

        <button type="submit">Calculate Result</button> <button type="button" onclick="document.getElementById('result').style.display = 'none';">Clear Result</button>

    </form>

    <div id="result" style="display: none;">
        <p>Student Name: <span id="displayName">-</span></p>
        <p>Total Score: <span id="total">-</span></p>
        <p>Average Score: <span id="average">-</span></p>
        <p>Grade: <span id="grade">-</span></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
