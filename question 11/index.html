
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathematical Utility Application</title>

    <style>
        #result {
            display: none;
        }
    </style>
</head>

<body>

    <h1>Mathematical Utility Application</h1>

    <form id="calculatorForm">

        <label for="number1">First Number:</label>
        <input type="number" id="number1" placeholder="Enter first number" step="any" required>

        <br><br>

        <label for="number2">Second Number:</label>
        <input type="number" id="number2" placeholder="Enter second number" step="any" required>

        <br><br>

        <label for="operation">Select Operation:</label>

        <select id="operation" required>
            <option value="">Choose Operation</option>
            <option value="add">Addition (+)</option>
            <option value="subtract">Subtraction (-)</option>
            <option value="multiply">Multiplication (*)</option>
            <option value="divide">Division (/)</option>
        </select>

        <br><br>

        <button type="submit">Calculate</button>

    </form>

    <div id="result">

        <h2>Calculation Result</h2>

        <p id="message"></p>

    </div>

    <script type="module" src="app.js"></script>

</body>
</html>
