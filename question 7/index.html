
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Account Management System</title>

    <style>
        #accountActions {
            display: none;
        }
    </style>
</head>
<body>

    <h1>Bank Account Management System</h1>

    <!-- Create Bank Account -->
    <h2>Create Account</h2>

    <form id="accountForm">

        <label>Account Holder's Name:</label>
        <input type="text" id="holderName" placeholder="Enter full name" required>
        <br><br>

        <label>Account Number:</label>
        <input type="text" id="accountNumber" placeholder="Enter account number" required>
        <br><br>

        <label>Initial Balance:</label>
        <input type="number" id="initialBalance" placeholder="Enter initial balance" min="0" step="any" required>
        <br><br>

        <button type="submit">Create Account</button>

    </form>

    <div id="accountActions">

        <hr>

        <!-- Deposit Money -->
        <h2>Deposit Money</h2>

        <form id="depositForm">

            <label>Deposit Amount:</label>
            <input type="number" id="depositAmount" placeholder="Enter amount" min="0.01" step="any" required>

            <button type="submit">Deposit</button>

        </form>

        <hr>

        <!-- Withdraw Money -->
        <h2>Withdraw Money</h2>

        <form id="withdrawForm">

            <label>Withdrawal Amount:</label>
            <input type="number" id="withdrawAmount" placeholder="Enter amount" min="0.01" step="any" required>

            <button type="submit">Withdraw</button>

        </form>

        <hr>

        <!-- Account Information -->
        <h2>Account Information</h2>

        <button type="button" id="checkBalanceBtn">Check Balance</button>

        <button type="button" id="displayAccountBtn">Display Account Information</button>

        <div id="accountInfo"></div>

        <p id="transactionMessage"></p>

    </div>

    <script src="script.js"></script>

</body>
</html>
