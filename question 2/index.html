
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Salary Calculator</title>

    <style>
        #result {
            display: none;
        }
    </style>
</head>
<body>

    <h1>Employee Salary Calculator</h1>

    <form id="salaryForm">

        <label for="employeeName">Employee Name:</label>
        <input type="text" id="employeeName" placeholder="Enter employee name" required>

        <br><br>

        <label for="basicSalary">Basic Monthly Salary:</label>
        <input type="number" id="basicSalary" placeholder="Enter basic salary" min="0" step="any" required>

        <br><br>

        <button type="submit">Calculate Salary</button> <button type="button" onclick="document.getElementById('result').style.display = 'none';">Clear Result</button>  

    </form>

    <div id="result">

        <h2>Employee Salary Breakdown</h2>

        <p>Employee Name: <span id="displayName">-</span></p>
        <p>Basic Salary: <span id="displayBasic">-</span></p>
        <p>Housing Allowance (10%): <span id="housing">-</span></p>
        <p>Transport Allowance (5%): <span id="transport">-</span></p>
        <p>Tax Deduction (3%): <span id="tax">-</span></p>

        <h3>Final Monthly Salary: <span id="finalSalary">-</span></h3>

    </div>

    <script src="script.js"></script>

</body>
</html>
