
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Analysis System</title>

    <style>
        #result {
            display: none;
        }
    </style>
</head>
<body>

    <h1>Number Analysis System</h1>

    <form id="numberForm">

        <h3>Enter 15 Numbers</h3>

        <label>Number 1:</label>
        <input type="number" id="num1" required>
        <br><br>

        <label>Number 2:</label>
        <input type="number" id="num2" required>
        <br><br>

        <label>Number 3:</label>
        <input type="number" id="num3" required>
        <br><br>

        <label>Number 4:</label>
        <input type="number" id="num4" required>
        <br><br>

        <label>Number 5:</label>
        <input type="number" id="num5" required>
        <br><br>

        <label>Number 6:</label>
        <input type="number" id="num6" required>
        <br><br>

        <label>Number 7:</label>
        <input type="number" id="num7" required>
        <br><br>

        <label>Number 8:</label>
        <input type="number" id="num8" required>
        <br><br>

        <label>Number 9:</label>
        <input type="number" id="num9" required>
        <br><br>

        <label>Number 10:</label>
        <input type="number" id="num10" required>
        <br><br>

        <label>Number 11:</label>
        <input type="number" id="num11" required>
        <br><br>

        <label>Number 12:</label>
        <input type="number" id="num12" required>
        <br><br>

        <label>Number 13:</label>
        <input type="number" id="num13" required>
        <br><br>

        <label>Number 14:</label>
        <input type="number" id="num14" required>
        <br><br>

        <label>Number 15:</label>
        <input type="number" id="num15" required>
        <br><br>

        <button type="submit">Analyze Numbers</button>

    </form>

    <div id="result">

        <h2>Number Analysis Result</h2>

        <p>Even Numbers: <span id="evenNumbers"></span></p>

        <p>Odd Numbers: <span id="oddNumbers"></span></p>

        <p>Largest Number: <span id="largest"></span></p>

        <p>Smallest Number: <span id="smallest"></span></p>

        <p>Sum: <span id="sum"></span></p>

        <p>Average: <span id="average"></span></p>

    </div>

    <script src="script.js"></script>

</body>
</html>
