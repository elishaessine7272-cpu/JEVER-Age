
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini User Management Application</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <h1>Mini User Management Application</h1>

        <!-- 1. REGISTER NEW USER -->
        <section>

            <h2 id="formTitle">Register New User</h2>

            <form id="userForm" novalidate>

                <label for="fullName">Full Name:</label>
                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter full name"
                    required
                >

                <br><br>

                <label for="email">Email Address:</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter email address"
                    required
                >

                <br><br>

                <label for="age">Age:</label>
                <input
                    type="number"
                    id="age"
                    placeholder="Enter age"
                    min="1"
                    step="1"
                    required
                >

                <br><br>

                <button type="submit" id="submitBtn">
                    Register User
                </button>

                <button type="button" id="cancelEditBtn" hidden>
                    Cancel Update
                </button>

            </form>

            <p id="formMessage"></p>

        </section>

        <hr>

        <!-- 2. DISPLAY ALL USERS -->
        <section>

            <h2>All Registered Users</h2>

            <button type="button" id="displayAllBtn">
                Display All Users
            </button>

            <p id="listMessage">Click the button to display registered users.</p>

            <div id="userTableContainer" hidden>

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Full Name</th>
                            <th>Email</th>
                            <th>Age</th>
                            <th>Registration Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="userList"></tbody>

                </table>

            </div>

        </section>

        <hr>

        <!-- 3. RETRIEVE SINGLE USER BY ID -->
        <section>

            <h2>Retrieve User by ID</h2>

            <form id="idSearchForm">

                <label for="searchId">Enter User ID:</label>

                <input
                    type="text"
                    id="searchId"
                    placeholder="e.g. USR-0001"
                    required
                >

                <button type="submit">Find User</button>

            </form>

            <p id="idMessage"></p>

            <div id="userDetails" hidden>

                <h3>User Information</h3>

                <p>User ID: <span id="detailId"></span></p>

                <p>Full Name: <span id="detailName"></span></p>

                <p>Email: <span id="detailEmail"></span></p>

                <p>Age: <span id="detailAge"></span></p>

                <p>Registration Date: <span id="detailDate"></span></p>

            </div>

        </section>

        <hr>

        <!-- 4. SEARCH USERS BY NAME -->
        <section>

            <h2>Search Users by Name</h2>

            <form id="nameSearchForm">

                <label for="searchName">Enter User Name:</label>

                <input
                    type="text"
                    id="searchName"
                    placeholder="Enter full name or part of name"
                    required
                >

                <button type="submit">Search Users</button>

                <button type="button" id="clearSearchBtn">
                    Clear Search
                </button>

            </form>

            <p id="nameMessage"></p>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
